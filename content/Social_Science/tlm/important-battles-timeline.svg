<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">भारतीय इतिहास के प्रमुख युद्धों की समयरेखा</title><desc id="desc">326 ईसा पूर्व से 1857 तक चुनिंदा युद्ध और संघर्ष</desc><rect width="900" height="300" rx="24" fill="#f2f6fb"/><path d="M70 150H830" stroke="#174b70" stroke-width="7" stroke-linecap="round"/><g fill="#e5a52d" stroke="white" stroke-width="5"><circle cx="100" cy="150" r="14"/><circle cx="250" cy="150" r="14"/><circle cx="400" cy="150" r="14"/><circle cx="550" cy="150" r="14"/><circle cx="700" cy="150" r="14"/><circle cx="820" cy="150" r="14"/></g><g font-family="sans-serif" fill="#17324c" text-anchor="middle"><g font-size="21" font-weight="bold"><text x="100" y="95">326 ई.पू.</text><text x="250" y="95">1192</text><text x="400" y="95">1526</text><text x="550" y="95">1757</text><text x="700" y="95">1764</text><text x="820" y="95">1857</text></g><g font-size="15"><text x="100" y="195">झेलम</text><text x="250" y="195">तराइन</text><text x="400" y="195">पानीपत I</text><text x="550" y="195">प्लासी</text><text x="700" y="195">बक्सर</text><text x="820" y="195">विद्रोह</text></g></g><text x="450" y="260" font-family="sans-serif" font-size="18" fill="#476174" text-anchor="middle">चुनिंदा युद्ध और ऐतिहासिक संघर्ष • कालानुक्रमिक पुनरावृत्ति</text></svg>